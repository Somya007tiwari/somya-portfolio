<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Somya Tiwari | Software Developer</title>
    <meta
      name="description"
      content="Portfolio of Somya Tiwari, a Software Developer and Computer Science student passionate about full-stack development, problem solving, and building practical web applications."
    />
    <!-- Open Graph -->
    <meta property="og:title" content="Somya Tiwari | Software Developer" />
    <meta
      property="og:description"
      content="Portfolio of Somya Tiwari — Software Developer passionate about full-stack development and building practical web applications."
    />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="en_IN" />
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Fira+Code:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <script>
      // Prevent FOUC: apply theme before React mounts
      (function () {
        try {
          var stored = localStorage.getItem("theme");
          var prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
          var theme = stored || (prefersDark ? "dark" : "light");
          document.documentElement.setAttribute("data-theme", theme);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
